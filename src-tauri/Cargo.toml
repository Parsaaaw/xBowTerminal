[package]
name = "xbow"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
dirs-next = "2"

[profile.release]
# Smaller, faster binary - this is most of the RAM/startup win over Electron.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
